<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>墨印审阅台 · AMO Studio 设计预览</title>
<style>
* { box-sizing: border-box; }
:root { color-scheme: light dark; font: 14px/1.55 "Segoe UI", "Microsoft YaHei UI", sans-serif; }
body { margin: 0; background: var(--bg); color: var(--ink); }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible { outline: 2px solid var(--focus); outline-offset: 3px; }
h1, h2, h3, p { margin: 0; }
.theme-control { border: 1px solid var(--line); background: var(--paper); color: var(--ink); padding: 5px 10px; border-radius: 6px; font-size: 12px; }
::selection { background: var(--focus); color: var(--bg); }

:root { --bg:light-dark(#fffdf8,#191918); --paper:light-dark(#f1eee7,#252522); --ink:light-dark(#222421,#f1f0e7); --dim:light-dark(#605e56,#b2b1a7); --line:light-dark(#cecac0,#464640); --focus:light-dark(#943b2c,#f0a08d); --serif:"Songti SC","STSong","SimSun",Georgia,serif; }
body { max-width:1560px; margin:auto; padding:0 clamp(18px,5vw,86px) 32px; }
header { height:82px; display:flex; align-items:center; justify-content:space-between; border-bottom:2px solid var(--ink); }
.wordmark { font:700 28px Georgia,serif; letter-spacing:-.065em; }
.head-tools { display:flex; align-items:center; gap:18px; color:var(--dim); font-size:12px; }
.page-head { padding:28px 0 22px; display:flex; align-items:baseline; gap:20px; border-bottom:1px solid var(--ink); }
h1 { font:700 clamp(24px,3vw,40px)/1.3 var(--serif); }
.page-head span { color:var(--dim); font-size:13px; }
.layout { display:grid; grid-template-columns:minmax(250px,.84fr) minmax(0,1.65fr); }
.index { border-right:1px solid var(--line); padding:22px 26px 20px 0; }
.filters { display:flex; gap:14px; margin-bottom:17px; }
.filters button { border:0; border-bottom:2px solid transparent; background:none; color:var(--dim); padding:4px 0; }
.filters [aria-pressed=true] { border-color:var(--ink); color:var(--ink); font-weight:650; }
.item { display:block; width:100%; text-align:left; background:none; border:0; border-top:1px solid var(--line); padding:13px 12px; }
.item[aria-pressed=true] { color:var(--ink); background:var(--paper); }
.item:hover { background:var(--paper); }
.item strong { display:block; font-size:16px; font-family:var(--serif); }
.item-foot { font:12px/1.7 "Segoe UI","Microsoft YaHei",sans-serif; margin-top:5px; display:flex; justify-content:space-between; color:var(--dim); }
.item-foot b { color:var(--focus); font-weight:600; }
article { min-width:0; padding:32px clamp(20px,4vw,68px) 40px; }
.byline { display:flex; gap:12px; flex-wrap:wrap; align-items:center; font-size:12px; color:var(--dim); }
.stamp { border:1px solid currentColor; padding:1px 6px; border-radius:2px; color:var(--focus); font-weight:650; }
article h2 { font:700 clamp(32px,4.2vw,60px)/1.25 var(--serif); letter-spacing:-.035em; margin:24px 0 16px; }
.lead { font-size:17px; line-height:1.85; color:var(--dim); max-width:34em; }
h3 { font:700 18px var(--serif); margin-top:32px; padding-bottom:10px; border-bottom:1px solid var(--ink); }
ol { padding:0; list-style:none; counter-reset:steps; margin:0; }
li { counter-increment:steps; display:flex; gap:18px; padding:14px 0; border-bottom:1px solid var(--line); }
li::before { content:counter(steps,decimal-leading-zero); color:var(--dim); font:italic 17px Georgia,serif; }
.turns { margin-top:20px; display:flex; align-items:center; justify-content:space-between; }
.turns button { background:transparent; border:1px solid var(--line); padding:6px 12px; border-radius:2px; }
.turns button:hover { background:var(--paper); }
.turns button:disabled { opacity:.38; cursor:default; }.position { color:var(--dim); font:14px Georgia,serif; }
@media (prefers-reduced-motion:no-preference) { .item { transition:background-color 120ms ease; } .sheet { animation:turn 180ms ease-out; } @keyframes turn { from {opacity:.64;transform:translateX(5px)} } }
@media(max-width:760px){ .layout {display:flex;flex-direction:column;} header{height:62px}.index{border-right:0;padding:14px 0}.entries{display:flex;overflow:auto;gap:6px}.item{min-width:180px;width:auto;border:1px solid var(--line)}article{border-top:1px solid var(--ink);padding:22px 0}.page-head{padding:16px 0} }

</style>
</head>
<body>

<header><div class="wordmark">AMO Studio</div><div class="head-tools"><span>本地工作空间</span><span data-theme-slot></span></div></header>
<div class="page-head"><h1>任务简报</h1><span>按最近更新排序</span></div>
<main class="layout">
  <aside class="index"><div class="filters" aria-label="筛选任务"><button data-scope="all" aria-pressed="true">全部任务</button><button data-scope="review" aria-pressed="false">待审阅</button></div><div class="entries"></div></aside>
  <article><div id="content"></div><div class="turns"><button id="prev">← 上一项</button><span class="position"></span><button id="next">下一项 →</button></div></article>
</main>
<script>
const root = document.documentElement;
function applyTheme(theme) {
  if (theme === 'light' || theme === 'dark') root.style.colorScheme = theme;
}
applyTheme(new URLSearchParams(location.search).get('theme') || 'light');
if (window.parent === window) {
  const toggle = document.createElement('button');
  toggle.className = 'theme-control';
  toggle.textContent = '深色模式';
  toggle.setAttribute('aria-pressed', String(root.style.colorScheme === 'dark'));
  toggle.addEventListener('click', () => {
    applyTheme(root.style.colorScheme === 'dark' ? 'light' : 'dark');
    toggle.setAttribute('aria-pressed', String(root.style.colorScheme === 'dark'));
  });
  document.querySelector('[data-theme-slot]').append(toggle);
} else {
  window.addEventListener('message', (event) => {
    if (event.source === window.parent) applyTheme(event.data?.previewTheme);
  });
}
const tasks = [
  {
    "title": "重新设计设置导航",
    "desc": "把搜索与分类放在左栏，滚动长设置页时保留标题和操作。",
    "project": "AMO Studio",
    "status": "待审阅",
    "model": "Codex",
    "time": "15:40",
    "history": [
      "核对分类与搜索的入口",
      "完成窄窗口与深浅主题检查",
      "提交导航预览，等待确认"
    ]
  },
  {
    "title": "梳理画布的拖拽反馈",
    "desc": "拖动任务时标明目标位置，松开后保留选中状态。",
    "project": "AMO Studio",
    "status": "进行中",
    "model": "Claude",
    "time": "14:20",
    "history": [
      "检查框选与移动的手势",
      "比较两种落点提示",
      "正在验证连续拖动"
    ]
  },
  {
    "title": "调整模型切换入口",
    "desc": "让常用模型和当前渠道在新建任务时更容易找到。",
    "project": "AMO Studio",
    "status": "待办",
    "model": "Codex",
    "time": "13:10",
    "history": [
      "记录常用模型的选择路径",
      "整理项目默认值"
    ]
  },
  {
    "title": "核对图集导出尺寸",
    "desc": "逐项检查导出倍率、透明边缘和命名规则。",
    "project": "素材管线",
    "status": "进行中",
    "model": "Codex",
    "time": "11:30",
    "history": [
      "读取图集清单",
      "已检查两组导出尺寸",
      "正在核对透明边缘"
    ]
  },
  {
    "title": "整理图标资源",
    "desc": "统一工具栏图标的线宽、视觉中心和导出命名。",
    "project": "素材管线",
    "status": "完成",
    "model": "Claude",
    "time": "10:45",
    "history": [
      "整理图标来源",
      "统一导出设置",
      "完成资源检查"
    ]
  },
  {
    "title": "检查会话恢复流程",
    "desc": "确认重新打开工作台后能够回到上次处理的任务。",
    "project": "AMO Studio",
    "status": "待办",
    "model": "Codex",
    "time": "09:15",
    "history": [
      "列出恢复场景",
      "准备隔离测试数据"
    ]
  }
];

let visible = tasks;
let selected = 0;
const entries = document.querySelector('.entries');
function select(index) {
  selected=index;
  const t=visible[index];
  entries.querySelectorAll('button').forEach((b,i)=>b.setAttribute('aria-pressed',String(i===index)));
  document.querySelector('#content').innerHTML=`<div class="sheet"><div class="byline"><span class="stamp">${t.status}</span><span>${t.project}</span><span>${t.model} · ${t.time} 更新</span></div><h2>${t.title}</h2><p class="lead">${t.desc}</p><h3>本轮进展</h3><ol>${t.history.map(s=>'<li>'+s+'</li>').join('')}</ol></div>`;
  document.querySelector('.position').textContent=(index+1)+' / '+visible.length;
  document.getElementById('prev').disabled=index===0;
  document.getElementById('next').disabled=index===visible.length-1;
}
function render(scope) {
  visible=scope==='review'?tasks.filter(t=>t.status==='待审阅'):tasks;
  entries.innerHTML=visible.map((t,i)=>`<button class="item" data-index="${i}"><strong>${t.title}</strong><span class="item-foot"><span>${t.status}</span><time>${t.time}</time></span></button>`).join('');
  select(0);
}
entries.onclick=e=>{const b=e.target.closest('.item');if(b)select(Number(b.dataset.index))};
document.querySelectorAll('[data-scope]').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('[data-scope]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));
  render(b.dataset.scope);
});
document.getElementById('prev').onclick=()=>select(selected-1);
document.getElementById('next').onclick=()=>select(selected+1);
render('all');
</script>
</body>
</html>
