<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AMO · 团队任务预览</title>
<style>
  :root {
    color-scheme: light;
    --ink: #243020;
    --muted: #55634d;
    --accent: #385b24;
    --lime: #ccedaa;
    --selected: #e6efd8;
    --line: #d8dfce;
    --line-strong: #a4b490;
    --ground: #f8f9f3;
    --nav: #eff2e8;
    --white: #fffefa;
    --amber: #7c4d1f;
    --amber-tint: #f5ead7;
    --violet: #594c76;
    --violet-tint: #efeaf5;
    font: 14px/1.55 "Segoe UI", "Microsoft YaHei UI", "PingFang SC", sans-serif;
    color: var(--ink);
    background: var(--ground);
    accent-color: var(--accent);
  }
  * { box-sizing: border-box; }
  body, h1, h2, h3, p { margin: 0; }
  button, input, select, textarea { font: inherit; color: inherit; }
  button, select { cursor: pointer; }
  button:disabled { cursor: default; opacity: .55; }
  button:focus-visible, a:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 3px;
  }
  ::selection { background: var(--lime); color: var(--ink); }
  [hidden] { display: none !important; }
  button { border: 0; background: none; }
  h1, h2, h3 { line-height: 1.35; text-wrap: balance; }
  h1 { font-size: 28px; letter-spacing: -.025em; }
  h2 { font-size: 19px; }
  h3 { font-size: 15px; }
  .icon { width: 17px; height: 17px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  .top { min-height: 56px; padding: 0 23px; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 12px; border-bottom: 1px solid var(--line); background: var(--ground); }
  .brand, .identity, .toolbar, .toolbar-group, .panel-heading, .row-meta, .person, .attachment, .actions { display: flex; align-items: center; gap: 9px; }
  .brand { font-size: 16px; font-weight: 750; letter-spacing: -.02em; white-space: nowrap; }
  .brand-mark { width: 29px; height: 29px; display: grid; place-items: center; background: var(--lime); border-radius: 8px; color: #25441b; }
  .brand-mark .icon { width: 19px; height: 19px; }
  .identity { justify-self: end; color: var(--muted); font-size: 12px; white-space: nowrap; }
  .preview-label { padding-right: 10px; border-right: 1px solid var(--line); }
  .avatar { display: inline-grid; place-items: center; flex: none; width: 26px; height: 26px; border-radius: 50%; background: var(--selected); color: var(--accent); font-size: 12px; font-weight: 700; }
  .switch { display: flex; gap: 2px; padding: 3px; background: var(--nav); border-radius: 8px; }
  .switch button { padding: 5px 13px; border-radius: 5px; font-size: 13px; color: var(--muted); white-space: nowrap; }
  .switch button[aria-pressed="true"] { background: var(--white); color: var(--ink); font-weight: 700; box-shadow: 0 1px 2px #27332514; }
  .switch button:hover { color: var(--ink); }
  .btn { min-height: 35px; padding: 6px 12px; display: inline-flex; align-items: center; justify-content: center; gap: 7px; border: 1px solid var(--line-strong); border-radius: 7px; background: var(--white); font-weight: 650; white-space: nowrap; }
  .btn:hover { background: var(--selected); }
  .primary { background: var(--lime); border-color: var(--lime); color: #223c19; }
  .primary:hover { background: #bcdf97; border-color: #bcdf97; }
  .quiet { background: transparent; border-color: transparent; color: var(--muted); }
  .quiet:hover { background: var(--nav); }
  .icon-btn { width: 33px; height: 33px; padding: 0; display: grid; place-items: center; border-radius: 6px; color: var(--muted); }
  .icon-btn:hover { background: var(--selected); color: var(--accent); }
  .studio { display: grid; grid-template-columns: 190px minmax(0, 1fr); min-height: calc(100vh - 56px); }
  .nav { background: var(--nav); border-right: 1px solid var(--line); padding: 17px 12px; display: flex; flex-direction: column; gap: 22px; }
  .nav-group { display: grid; gap: 4px; }
  .nav-label { padding: 0 9px 4px; color: var(--muted); font-size: 12px; }
  .nav-item { display: flex; align-items: center; gap: 8px; width: 100%; padding: 8px 9px; text-align: left; border-radius: 7px; overflow-wrap: anywhere; }
  .nav-item:hover, .nav-item[aria-current="true"] { background: var(--selected); color: var(--accent); }
  .nav-item[aria-current="true"] { font-weight: 700; }
  .count { margin-left: auto; font: 600 12px/1.4 "Cascadia Mono", Consolas, monospace; color: var(--muted); }
  .workspace { min-width: 0; display: grid; grid-template-columns: minmax(0, 1fr) 356px; }
  .workspace.inbox-closed { grid-template-columns: minmax(0, 1fr); }
  .workhead { padding: 19px 23px 17px; border-bottom: 1px solid var(--line); }
  .toolbar { justify-content: space-between; flex-wrap: wrap; }
  .toolbar-group { flex-wrap: wrap; }
  .toolbar-group #inbox-toggle { display: none; }
  .board-label { color: var(--muted); font-size: 12px; margin-top: 5px; }
  .project-select { display: none; }
  .board { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 13px; align-items: start; padding: 23px 23px 30px; }
  .lane { min-width: 0; }
  .lane-head { padding: 0 1px 8px; border-bottom: 2px solid var(--line); display: flex; align-items: baseline; gap: 7px; }
  .lane-head .count { margin-left: 0; }
  .lane:nth-child(2) h3 { color: var(--accent); }
  .lane:nth-child(3) h3 { color: var(--amber); }
  .lane:nth-child(4) h3 { color: var(--violet); }
  .drop-target { margin: 10px 0; min-height: 81px; display: grid; place-content: center; justify-items: center; gap: 4px; padding: 10px 6px; border: 1px dashed var(--line-strong); border-radius: 8px; background: #f0f4e8; color: var(--accent); text-align: center; font-size: 12px; transition: background 150ms ease, border-color 150ms ease; }
  .drop-target .icon { width: 20px; height: 20px; }
  .lane.drag-ready .drop-target { background: var(--selected); border-color: var(--accent); }
  .lane.drag-over .drop-target { background: var(--lime); border-style: solid; border-color: var(--accent); }
  .lane-stack { display: grid; gap: 8px; margin-top: 10px; }
  .local-card { width: 100%; display: grid; gap: 8px; min-height: 88px; padding: 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--white); text-align: left; overflow-wrap: anywhere; }
  .local-card:hover { border-color: var(--line-strong); background: #fcfdf8; }
  .local-card strong { font-size: 13px; line-height: 1.5; }
  .local-card.arrived { animation: arrived 670ms ease-out; }
  @keyframes arrived { from { background: var(--lime); border-color: var(--accent); transform: translateY(-5px); } }
  .meta, .hint { color: var(--muted); font-size: 12px; }
  .row-meta { flex-wrap: wrap; gap: 6px 10px; }
  .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: #7a8571; flex: none; }
  .dot.green { background: #5e863a; }
  .dot.amber { background: #a96c39; }
  .dot.violet { background: #86729e; }
  .ticket-id { color: var(--muted); font: 12px/1.45 "Cascadia Mono", Consolas, monospace; white-space: nowrap; }
  .inbox { align-self: stretch; min-width: 0; border-left: 1px solid var(--line); background: var(--white); }
  .inbox-inner { position: sticky; top: 0; }
  .inbox-head { padding: 18px 19px 0; }
  .panel-heading { justify-content: space-between; }
  .panel-heading h2 { display: flex; align-items: center; gap: 8px; }
  .panel-heading h2 .icon { color: var(--accent); }
  .filters { display: flex; gap: 17px; border-bottom: 1px solid var(--line); margin-top: 12px; }
  .filter { min-height: 34px; margin-bottom: -1px; padding: 4px 0; border-bottom: 2px solid transparent; color: var(--muted); white-space: nowrap; }
  .filter[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); font-weight: 700; }
  .filter .count { margin-left: 4px; }
  .inbox-list { display: grid; gap: 3px; padding: 9px 12px; max-height: 255px; overflow: auto; }
  .inbox-item { display: grid; grid-template-columns: 16px minmax(0, 1fr); gap: 7px; align-items: center; border: 1px solid transparent; border-radius: 8px; padding: 8px; }
  .inbox-item.imported { grid-template-columns: minmax(0, 1fr); padding-left: 13px; }
  .inbox-item[draggable="true"] { cursor: grab; }
  .inbox-item[draggable="true"]:active { cursor: grabbing; }
  .inbox-item:hover { background: var(--ground); }
  .inbox-item.selected { background: #edf3e5; border-color: #cedcbe; }
  .grip { color: #65795a; }
  .item-button { display: grid; gap: 2px; min-width: 0; padding: 0; text-align: left; }
  .item-button strong { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13px; }
  .inbox-detail { border-top: 1px solid var(--line); padding: 16px 19px 18px; }
  .inbox-detail h3 { font-size: 17px; margin: 4px 0 10px; }
  .person { color: var(--muted); font-size: 12px; }
  .person .avatar { width: 22px; height: 22px; font-size: 11px; }
  .description { margin: 13px 0; line-height: 1.75; white-space: pre-wrap; overflow-wrap: anywhere; max-width: 68ch; }
  .attachment-list { display: flex; flex-wrap: wrap; gap: 6px; margin: 12px 0; }
  .attachment { width: fit-content; max-width: 100%; padding: 5px 8px; border: 1px solid var(--line); border-radius: 6px; color: var(--accent); background: var(--ground); text-decoration: none; font-size: 12px; overflow-wrap: anywhere; }
  .attachment:hover { border-color: var(--line-strong); }
  .attachment .icon { width: 15px; height: 15px; }
  .inbox-detail .primary, .inbox-detail .btn { margin-top: 6px; width: 100%; }
  .target-hint { text-align: center; margin-top: 6px; }
  .pill { display: inline-flex; align-items: center; gap: 5px; width: fit-content; padding: 2px 7px; border-radius: 5px; font-size: 12px; color: var(--accent); background: var(--selected); white-space: nowrap; }
  .pill.pending { background: var(--nav); color: var(--muted); }
  .pill.review { background: var(--amber-tint); color: var(--amber); }
  .pill.done { background: var(--violet-tint); color: var(--violet); }
  .empty { padding: 17px 7px; color: var(--muted); font-size: 13px; }
  .local-detail { margin: 26px auto; width: min(100% - 46px, 640px); }
  .local-detail h2 { margin: 10px 0; }
  .local-detail .actions, .submitted-detail .actions { flex-wrap: wrap; margin-top: 18px; }
  .link { padding: 0; color: var(--accent); font-size: 13px; text-decoration: underline; text-underline-offset: 3px; }
  .feedback-form { display: grid; gap: 8px; margin-top: 16px; max-width: 520px; }
  .feedback-form .btn { justify-self: start; }
  .relay { max-width: 1180px; padding: 39px 32px 48px; margin: 0 auto; }
  .relay-header { margin-bottom: 22px; }
  .relay-header p { margin-top: 6px; color: var(--muted); }
  .relay-body { display: grid; grid-template-columns: 315px minmax(0, 1fr); align-items: start; border: 1px solid var(--line); border-radius: 11px; background: var(--white); }
  .sent { min-width: 0; align-self: stretch; border-right: 1px solid var(--line); background: #f4f6ee; border-radius: 10px 0 0 10px; }
  .sent-head { padding: 19px 17px 13px; }
  .sent-head h2 { font-size: 17px; }
  .sent-items { display: grid; padding: 0 10px 14px; gap: 4px; }
  .sent-item { display: grid; gap: 5px; min-width: 0; padding: 10px 9px; border: 1px solid transparent; border-radius: 7px; text-align: left; }
  .sent-item:hover, .sent-item[aria-current="true"] { background: var(--selected); }
  .sent-item[aria-current="true"] { border-color: #cedcbe; }
  .sent-item strong { font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .form-area { padding: 25px 30px 29px; min-width: 0; }
  .form-area h2 { margin-bottom: 18px; }
  .task-form { max-width: 620px; display: grid; gap: 16px; }
  .field { display: grid; gap: 6px; font-weight: 650; }
  .field input, .field select, .field textarea, .feedback-form textarea, .project-select { min-width: 0; padding: 8px 10px; border: 1px solid var(--line-strong); border-radius: 6px; background: var(--white); font-weight: 400; }
  textarea { min-height: 108px; resize: vertical; }
  ::placeholder { color: #58674f; opacity: 1; }
  .readonly { background: var(--ground) !important; }
  .form-actions { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; padding-top: 11px; border-top: 1px solid var(--line); }
  .form-actions .btn { padding-inline: 19px; }
  .file-field { display: grid; gap: 6px; }
  .file-label { display: flex; align-items: baseline; gap: 5px; font-weight: 650; }
  .file-picker { width: fit-content; }
  .file-picker + .hint { margin-top: 1px; }
  .file-name { color: var(--accent); font-size: 12px; overflow-wrap: anywhere; }
  .submitted-detail h2 { margin: 7px 0 10px; }
  .submitted-detail .result { margin-top: 21px; padding-top: 14px; border-top: 1px solid var(--line); }
  .result h3 { margin-bottom: 6px; }
  .toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); z-index: 2; max-width: calc(100% - 28px); padding: 9px 14px; border-radius: 7px; background: #273820; color: #f6faef; box-shadow: 0 6px 20px #27332524; text-align: center; }
  @media (max-width: 1240px) {
    .studio { grid-template-columns: 164px minmax(0, 1fr); }
    .workspace { grid-template-columns: minmax(0, 1fr) 320px; }
    .board { padding-inline: 16px; gap: 9px; }
    .workhead { padding-inline: 16px; }
  }
  @media (max-width: 1070px) {
    .board { grid-template-columns: repeat(2, minmax(0, 1fr)); row-gap: 22px; }
  }
  @media (max-width: 820px) {
    .studio, .workspace, .workspace.inbox-closed { grid-template-columns: minmax(0, 1fr); }
    .nav, .toolbar-group.desktop { display: none; }
    .project-select { display: block; max-width: 100%; }
    .toolbar-group #inbox-toggle { display: inline-flex; }
    .workhead, .board, .local-detail { grid-column: 1; }
    .main { display: contents; }
    .inbox { grid-column: 1; grid-row: 2; border-left: 0; border-bottom: 1px solid var(--line); }
    .inbox-inner { position: static; }
    .board { grid-row: 3; }
    .workhead { grid-row: 1; }
    .local-detail { grid-row: 3; }
    .relay-body { grid-template-columns: 240px minmax(0, 1fr); }
    .relay { padding: 26px 16px 35px; }
    .form-area { padding: 19px; }
  }
  @media (max-width: 580px) {
    .top { grid-template-columns: 1fr auto; min-height: 52px; padding: 7px 12px; }
    .identity { display: none; }
    .brand { font-size: 14px; gap: 6px; }
    .brand-mark { width: 24px; height: 24px; }
    .switch button { padding-inline: 8px; }
    .relay-body { grid-template-columns: minmax(0, 1fr); }
    .sent { border-right: 0; border-top: 1px solid var(--line); border-radius: 0 0 10px 10px; grid-row: 2; }
    .relay-header { margin-bottom: 16px; }
    h1 { font-size: 23px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
<svg hidden xmlns="http://www.w3.org/2000/svg">
  <symbol id="i-brand" viewBox="0 0 24 24"><path d="M8 4H5a1 1 0 0 0-1 1v3m12-4h3a1 1 0 0 1 1 1v3m0 8v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3"/><rect x="9" y="9" width="6" height="6" rx="1.2"/></symbol>
  <symbol id="i-inbox" viewBox="0 0 24 24"><path d="M3 13l3-7h12l3 7v5a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1zM3 13h5l2 3h4l2-3h5"/></symbol>
  <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3 7a1 1 0 0 1 1-1h5l2 2h9a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1z"/></symbol>
  <symbol id="i-grip" viewBox="0 0 24 24"><path d="M9 5h.01M15 5h.01M9 12h.01M15 12h.01M9 19h.01M15 19h.01" stroke-width="3"/></symbol>
  <symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
  <symbol id="i-add" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 12h14m-5-5 5 5-5 5"/></symbol>
  <symbol id="i-import" viewBox="0 0 24 24"><path d="M12 3v12m-4-4 4 4 4-4M5 15v5h14v-5"/></symbol>
  <symbol id="i-attach" viewBox="0 0 24 24"><path d="m9 13 6-6a3 3 0 1 1 4 4l-8 8a5 5 0 0 1-7-7l7-7m-5 9 7-7"/></symbol>
</svg>
<header class="top">
  <div class="brand"><span class="brand-mark" aria-hidden="true"><svg class="icon"><use href="#i-brand"/></svg></span><span id="brand">AMO Studio</span></div>
  <nav class="switch" aria-label="切换预览角色">
    <button type="button" data-view="studio" aria-pressed="true">Studio 接单</button>
    <button type="button" data-view="relay" aria-pressed="false">同事提单</button>
  </nav>
  <div class="identity"><span class="preview-label">交互预览</span><span class="avatar" id="user-avatar" aria-hidden="true">林</span><span id="user-name">林舟</span></div>
</header>
<section class="studio" id="studio" aria-label="Studio 接单">
  <aside class="nav" aria-label="项目导航">
    <div class="nav-group">
      <button class="nav-item" type="button" data-action="toggle-inbox" id="inbox-nav" aria-controls="inbox"><svg class="icon" aria-hidden="true"><use href="#i-inbox"/></svg>团队任务<span class="count" id="nav-count"></span></button>
    </div>
    <div class="nav-group" id="projects"></div>
  </aside>
  <div class="workspace" id="workspace">
    <main class="main">
      <header class="workhead">
        <div class="toolbar">
          <div><h1 id="project-title">JellybeanUnity</h1><p class="board-label">本地看板</p></div>
          <div class="toolbar-group">
            <select class="project-select" id="project-select" aria-label="本地项目"></select>
            <button class="btn" type="button" data-action="toggle-inbox" aria-controls="inbox" id="inbox-toggle"><svg class="icon" aria-hidden="true"><use href="#i-inbox"/></svg>团队任务</button>
          </div>
        </div>
      </header>
      <div class="board" id="board"></div>
      <section class="local-detail" id="local-detail" hidden aria-label="本地任务详情"></section>
    </main>
    <aside class="inbox" id="inbox" aria-labelledby="inbox-title">
      <div class="inbox-inner">
        <div class="inbox-head">
          <div class="panel-heading"><h2 id="inbox-title"><svg class="icon" aria-hidden="true"><use href="#i-inbox"/></svg>团队任务</h2><button class="icon-btn" type="button" data-action="toggle-inbox" aria-label="关闭团队任务"><svg class="icon" aria-hidden="true"><use href="#i-close"/></svg></button></div>
          <nav class="filters" aria-label="接单状态" id="filters"></nav>
        </div>
        <div class="inbox-list" id="inbox-list"></div>
        <div class="inbox-detail" id="inbox-detail"></div>
      </div>
    </aside>
  </div>
</section>
<main class="relay" id="relay" hidden>
  <header class="relay-header"><h1>团队任务</h1><p>提交问题或需求，跟踪进度和处理结果。</p></header>
  <div class="relay-body">
    <aside class="sent" aria-labelledby="sent-title">
      <div class="panel-heading sent-head"><h2 id="sent-title">我提交的</h2><button class="btn quiet" type="button" data-action="compose"><svg class="icon" aria-hidden="true"><use href="#i-add"/></svg>新建</button></div>
      <div class="sent-items" id="sent-items"></div>
    </aside>
    <section class="form-area" id="compose" aria-labelledby="compose-title">
      <h2 id="compose-title">新建任务</h2>
      <form class="task-form" id="task-form">
        <label class="field">标题<input name="title" maxlength="90" required placeholder="例如：结算界面偶尔黑屏"></label>
        <label class="field">接收人<input readonly value="林舟" class="readonly"></label>
        <label class="field">说明<textarea name="description" maxlength="1500" required placeholder="发生了什么？如果可以复现，请写下步骤和预期结果。"></textarea></label>
        <div class="file-field">
          <label class="file-label" for="task-files">附件 <span class="hint">（选填）</span></label>
          <input type="file" id="task-files" multiple hidden>
          <button type="button" class="btn file-picker" data-action="files"><svg class="icon" aria-hidden="true"><use href="#i-attach"/></svg>添加附件</button>
          <p class="hint" id="file-list">可以附上截图、日志或需求文档。</p>
        </div>
        <div class="form-actions"><p class="hint">提交后可在「我提交的」查看进度。</p><button class="btn primary" type="submit">提交任务<svg class="icon" aria-hidden="true"><use href="#i-arrow"/></svg></button></div>
      </form>
    </section>
    <section class="form-area submitted-detail" id="submitted-detail" aria-label="已提交任务详情" hidden></section>
  </div>
</main>
<div class="toast" id="toast" role="status" hidden></div>
<script>
  const projects = ["JellybeanUnity", "AmoStudio"];
  const sender = "周遥";
  const demoLog = URL.createObjectURL(new Blob(["示例日志\n[UI] Open Settlement\n[UI] Background transition completed\n[UI] Foreground panel callback missing\n"], { type: "text/plain;charset=utf-8" }));
  const tasks = [
    { id: "AMO-024", title: "结算界面偶尔黑屏", owner: sender, time: "今天 10:42", description: "连续完成两局，第二局点「领取奖励」后，结算页偶尔会停在黑屏，声音还在播放。\n\n预期：领取奖励后正常回到游戏首页。", files: [{ name: "结算复现日志.txt", url: demoLog }], status: "pending" },
    { id: "AMO-023", title: "商店按钮缺少按下反馈", owner: "沈岚", time: "今天 09:18", description: "商店里的购买按钮按住时没有状态变化。希望加入和主界面按钮一致的反馈。", files: [], status: "pending" },
    { id: "AMO-022", title: "画布拖动后误开详情", owner: "陈可", time: "昨天 16:20", description: "在画布里拖动任务卡，拖完后详情偶尔会一起打开。请将点击和拖动分开。", files: [], status: "pending" },
    { id: "AMO-021", title: "确认切屏视频循环边界", owner: sender, time: "昨天 14:35", description: "帮忙看一下切屏动画在循环末尾时会不会闪一帧。", files: [], status: "review", result: "调整了衔接帧，连续循环 10 次未看到闪帧。请在当前测试包复核。" },
    { id: "AMO-019", title: "补上首页返回入口", owner: sender, time: "周五 11:26", description: "从设置页内补一个可返回首页的入口。", files: [], status: "done", result: "已补上返回入口，并验证游戏手柄和鼠标都可操作。" },
  ];
  const localTasks = [
    { id: "L1", project: projects[0], lane: "todo", title: "梳理商店弹窗的层级" },
    { id: "L2", project: projects[0], lane: "todo", title: "整理首局引导文案" },
    { id: "L3", project: projects[0], lane: "doing", title: "调整视频切屏等待逻辑" },
    { id: "L4", project: projects[0], lane: "review", title: "检查奖励动画引用" },
    { id: "L5", project: projects[0], lane: "done", title: "更新首页按钮状态" },
    { id: "L6", project: projects[1], lane: "todo", title: "整理任务页的快捷操作" },
    { id: "L7", project: projects[1], lane: "doing", title: "检查画布多选反馈" },
  ];
  const lanes = [
    { id: "todo", name: "待办", detail: "未开始", color: "" },
    { id: "doing", name: "进行中", detail: "处理中", color: "green" },
    { id: "review", name: "待审阅", detail: "待确认", color: "amber" },
    { id: "done", name: "完成", detail: "已完成", color: "violet" },
  ];
  const statusText = { pending: "待处理", doing: "处理中", review: "待确认", done: "已完成" };
  const $ = (id) => document.getElementById(id);
  const byId = (id) => tasks.find((task) => task.id === id);
  const localBySource = (id) => localTasks.find((task) => task.source === id);
  const readFiles = (input) => [...input.files].map((file) => ({ name: file.name, url: URL.createObjectURL(file) }));
  const icon = (name) => `<svg class="icon" aria-hidden="true"><use href="#i-${name}"/></svg>`;
  const escape = (text) => String(text).replace(/[&<>"']/g, (char) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[char]);
  const pill = (task) => `<span class="pill ${task.status}">${statusText[task.status]}</span>`;
  const filesMarkup = (files) => files.length ? `<div class="attachment-list">${files.map((file) => `<a class="attachment" href="${escape(file.url)}" download="${escape(file.name)}">${icon("attach")}${escape(file.name)}</a>`).join("")}</div>` : "";
  let view = "studio";
  let project = projects[0];
  let inboxOpen = true;
  let filter = "new";
  let selected = tasks[0].id;
  let openedLocal = null;
  let openedSent = null;
  let writingResult = false;
  let dragId = null;
  let arrived = null;
  let serial = 24;
  let toastId;

  function notify(message) {
    clearTimeout(toastId);
    $("toast").textContent = message;
    $("toast").hidden = false;
    toastId = setTimeout(() => { $("toast").hidden = true; }, 3500);
  }

  function renderShell() {
    $("studio").hidden = view !== "studio";
    $("relay").hidden = view !== "relay";
    $("brand").textContent = view === "studio" ? "AMO Studio" : "AMO 中转";
    $("user-avatar").textContent = view === "studio" ? "林" : "周";
    $("user-name").textContent = view === "studio" ? "林舟" : sender;
    document.querySelectorAll("[data-view]").forEach((button) => button.setAttribute("aria-pressed", button.dataset.view === view));
  }

  function renderInbox() {
    const active = tasks.filter((task) => task.status === "pending" && !localBySource(task.id));
    const imported = tasks.filter((task) => localBySource(task.id));
    const shown = filter === "new" ? active : imported;
    if (!shown.some((task) => task.id === selected)) selected = shown[0]?.id ?? null;
    $("nav-count").textContent = active.length;
    $("inbox").hidden = !inboxOpen;
    $("workspace").classList.toggle("inbox-closed", !inboxOpen);
    $("inbox-toggle").setAttribute("aria-expanded", inboxOpen);
    $("inbox-nav").setAttribute("aria-expanded", inboxOpen);
    $("filters").innerHTML = [["new", "待接入", active.length], ["imported", "已加入本地", imported.length]].map(([id, name, count]) => `<button class="filter" data-filter="${id}" aria-pressed="${filter === id}">${name} <span class="count">${count}</span></button>`).join("");
    $("inbox-list").innerHTML = shown.length ? shown.map((task) => `
      <div class="inbox-item ${task.id === selected ? "selected" : ""} ${filter === "imported" ? "imported" : ""}" draggable="${filter === "new"}" data-ticket="${task.id}">
        ${filter === "new" ? `<span class="grip">${icon("grip")}</span>` : ""}
        <button class="item-button" data-action="select-ticket" data-id="${task.id}" aria-pressed="${task.id === selected}">
          <span class="row-meta"><span class="ticket-id">${task.id}</span><span class="meta">提交人 ${escape(task.owner)}</span></span>
          <strong>${escape(task.title)}</strong>
        </button>
      </div>`).join("") : `<p class="empty">${filter === "new" ? "待接入的任务都处理好了。" : "拖入待办的任务会出现在这里。"}</p>`;
    const task = byId(selected);
    const detail = $("inbox-detail");
    detail.hidden = !task;
    if (!task) return;
    detail.innerHTML = `<div class="row-meta"><span class="ticket-id">${task.id}</span>${pill(task)}</div>
      <h3>${escape(task.title)}</h3>
      <div class="person"><span class="avatar" aria-hidden="true">${escape(task.owner[0])}</span>${escape(task.owner)}<span aria-hidden="true">·</span>${escape(task.time)}</div>
      <p class="description">${escape(task.description)}</p>${filesMarkup(task.files)}
      ${filter === "new" ? `<button class="btn primary" data-action="import" data-id="${task.id}">${icon("import")}加入本地待办</button><p class="hint target-hint">加入 ${escape(project)} 的待办</p>` : `<button class="btn" data-action="open-source-local" data-id="${task.id}">查看本地任务${icon("arrow")}</button>`}`;
  }

  function renderBoard() {
    $("project-title").textContent = project;
    $("project-select").value = project;
    $("projects").innerHTML = `<p class="nav-label">本地项目</p>${projects.map((name) => `<button class="nav-item" data-project="${escape(name)}" aria-current="${name === project}">${icon("folder")}${escape(name)}</button>`).join("")}`;
    $("board").hidden = Boolean(openedLocal);
    $("local-detail").hidden = !openedLocal;
    if (openedLocal) {
      const local = localTasks.find((task) => task.id === openedLocal);
      const task = byId(local.source);
      const updated = task?.followup ? `<div class="result"><h3>提交人补充</h3><p class="description">${escape(task.followup)}</p></div>` : "";
      const result = task?.result ? `<div class="result"><h3>已提交的结果</h3><p class="description">${escape(task.result)}</p>${filesMarkup(task.resultFiles ?? [])}</div>` : "";
      const action = local.lane === "todo" ? `<button class="btn primary" data-action="start">开始执行${icon("arrow")}</button>` : local.lane === "doing" && task ? `<button class="btn primary" data-action="write-result">提交结果</button>` : "";
      $("local-detail").innerHTML = `<button class="link" data-action="back-board">返回本地看板</button><h2>${escape(local.title)}</h2>
        <div class="row-meta"><span class="pill ${local.lane === "todo" ? "pending" : local.lane}">${lanes.find((lane) => lane.id === local.lane).detail}</span>${task ? `<button class="link" data-action="show-origin" data-id="${task.id}">团队原单 ${task.id}</button>` : ""}</div>
        ${task ? `<p class="description">${escape(task.description)}</p>${filesMarkup(task.files)}` : ""}${updated}${result}
        ${writingResult ? `<form class="feedback-form" id="result-form"><label class="field">处理说明与验证结果<textarea name="result" maxlength="1500" required></textarea></label><label class="field">验证附件（选填）<input name="files" type="file" multiple></label><div class="actions"><button class="btn primary" type="submit">发给提交人</button><button class="btn quiet" type="button" data-action="cancel-result">取消</button></div></form>` : `<div class="actions">${action}</div>`}`;
      return;
    }
    $("board").innerHTML = lanes.map((lane) => {
      const cards = localTasks.filter((task) => task.project === project && task.lane === lane.id);
      return `<section class="lane" data-lane="${lane.id}" aria-labelledby="lane-${lane.id}">
        <div class="lane-head"><h3 id="lane-${lane.id}">${lane.name}</h3><span class="count">${cards.length}</span></div>
        ${lane.id === "todo" && inboxOpen ? `<div class="drop-target">${icon("import")}拖入团队任务</div>` : ""}
        <div class="lane-stack">${cards.map((task) => `<button class="local-card ${task.id === arrived ? "arrived" : ""}" data-action="open-local" data-id="${task.id}"><strong>${escape(task.title)}</strong><span class="row-meta"><span class="dot ${lane.color}"></span><span class="meta">${lane.detail}</span>${task.source ? `<span class="ticket-id">${task.source}</span>` : ""}</span></button>`).join("")}${cards.length === 0 && lane.id !== "todo" ? '<p class="empty">暂无任务</p>' : ""}</div>
      </section>`;
    }).join("");
    arrived = null;
  }

  function renderRelay() {
    $("sent-items").innerHTML = tasks.filter((task) => task.owner === sender).map((task) => `<button class="sent-item" aria-current="${openedSent === task.id}" data-action="open-sent" data-id="${task.id}"><span class="row-meta"><span class="ticket-id">${task.id}</span>${pill(task)}</span><strong>${escape(task.title)}</strong><span class="meta">${escape(task.time)}</span></button>`).join("");
    $("compose").hidden = Boolean(openedSent);
    $("submitted-detail").hidden = !openedSent;
    if (!openedSent) return;
    const task = byId(openedSent);
    const feedback = task.status === "review" ? `<div class="actions"><button class="btn primary" data-action="accept" data-id="${task.id}">确认完成</button></div><form id="followup-form" class="feedback-form"><label class="field">补充问题<textarea name="followup" required maxlength="1500" placeholder="告诉接收人还有哪里需要处理"></textarea></label><button class="btn" type="submit">发回继续处理</button></form>` : "";
    $("submitted-detail").innerHTML = `<div class="row-meta"><span class="ticket-id">${task.id}</span>${pill(task)}</div><h2>${escape(task.title)}</h2>
      <div class="person">接收人 林舟</div>
      <p class="description">${escape(task.description)}</p>${filesMarkup(task.files)}
      ${task.result ? `<div class="result"><h3>处理结果</h3><p class="description">${escape(task.result)}</p>${filesMarkup(task.resultFiles ?? [])}</div>` : ""}
      ${task.followup ? `<div class="result"><h3>补充问题</h3><p class="description">${escape(task.followup)}</p></div>` : ""}${feedback}`;
  }

  function render() {
    renderShell();
    renderBoard();
    renderInbox();
    renderRelay();
  }

  function importTicket(id) {
    const task = byId(id);
    if (!task) return;
    const existing = localBySource(id);
    if (existing) {
      openLocal(existing.id);
      notify(`${id} 已加入本地`);
      return;
    }
    if (task.status !== "pending") return;
    const localId = `local-${id}`;
    localTasks.unshift({ id: localId, title: task.title, project, lane: "todo", source: id });
    arrived = localId;
    filter = "imported";
    selected = id;
    openedLocal = null;
    render();
    document.querySelector(`[data-action="open-local"][data-id="${localId}"]`)?.focus({ preventScroll: true });
    notify(`${id} 已加入 ${project} 的待办`);
  }

  function openLocal(id) {
    const local = localTasks.find((task) => task.id === id);
    if (!local) return;
    project = local.project;
    openedLocal = id;
    writingResult = false;
    render();
    document.querySelector('[data-action="back-board"]')?.focus({ preventScroll: true });
  }

  function setProject(value) {
    project = value;
    openedLocal = null;
    renderBoard();
    renderInbox();
  }

  document.addEventListener("click", (event) => {
    const button = event.target.closest("button");
    if (!button) return;
    const { id, action } = button.dataset;
    if (button.dataset.view) {
      view = button.dataset.view;
      renderShell();
    }
    if (button.dataset.project) {
      setProject(button.dataset.project);
      document.querySelector(`[data-project="${project}"]`)?.focus();
    }
    if (button.dataset.filter) {
      filter = button.dataset.filter;
      renderInbox();
      document.querySelector(`[data-filter="${filter}"]`)?.focus();
    }
    switch (action) {
      case "toggle-inbox":
        inboxOpen = !inboxOpen;
        renderInbox();
        renderBoard();
        if (inboxOpen) document.querySelector('[data-filter][aria-pressed="true"]')?.focus();
        else (window.matchMedia("(max-width: 820px)").matches ? $("inbox-toggle") : $("inbox-nav")).focus();
        break;
      case "select-ticket":
        selected = id;
        renderInbox();
        document.querySelector(`[data-action="select-ticket"][data-id="${id}"]`)?.focus();
        break;
      case "import": importTicket(id); break;
      case "open-local": openLocal(id); break;
      case "open-source-local": openLocal(localBySource(id)?.id); break;
      case "back-board": {
        const previous = openedLocal;
        openedLocal = null;
        renderBoard();
        document.querySelector(`[data-action="open-local"][data-id="${previous}"]`)?.focus();
        break;
      }
      case "show-origin":
        inboxOpen = true;
        filter = "imported";
        selected = id;
        renderInbox();
        document.querySelector(`[data-action="select-ticket"][data-id="${id}"]`)?.focus();
        break;
      case "start": {
        const local = localTasks.find((task) => task.id === openedLocal);
        local.lane = "doing";
        const task = byId(local.source);
        if (task) task.status = "doing";
        render();
        (document.querySelector('[data-action="write-result"]') ?? document.querySelector('[data-action="back-board"]')).focus();
        notify("已移到进行中。预览中模拟启动会话。");
        break;
      }
      case "write-result":
        writingResult = true;
        renderBoard();
        $("result-form").elements.result.focus();
        break;
      case "cancel-result":
        writingResult = false;
        renderBoard();
        document.querySelector('[data-action="write-result"]')?.focus();
        break;
      case "compose":
        openedSent = null;
        renderRelay();
        $("task-form").elements.title.focus();
        break;
      case "open-sent":
        openedSent = id;
        renderRelay();
        document.querySelector(`[data-action="open-sent"][data-id="${id}"]`)?.focus();
        break;
      case "accept": {
        byId(id).status = "done";
        const local = localBySource(id);
        if (local) local.lane = "done";
        render();
        document.querySelector(`[data-action="open-sent"][data-id="${id}"]`)?.focus();
        notify(`${id} 已确认完成`);
        break;
      }
      case "files": $("task-files").click(); break;
    }
  });

  $("project-select").addEventListener("change", (event) => setProject(event.target.value));
  $("task-files").addEventListener("change", () => {
    const files = [...$("task-files").files];
    $("file-list").textContent = files.length ? files.map((file) => file.name).join("、") : "可以附上截图、日志或需求文档。";
    $("file-list").classList.toggle("file-name", files.length > 0);
  });

  document.addEventListener("submit", (event) => {
    event.preventDefault();
    const form = event.target;
    if (form.id === "task-form") {
      const { title, description } = form.elements;
      if (!title.value.trim() || !description.value.trim()) {
        notify("请填写标题和说明。");
        (!title.value.trim() ? title : description).focus();
        return;
      }
      const id = `AMO-${String(++serial).padStart(3, "0")}`;
      const files = readFiles($("task-files"));
      tasks.unshift({ id, title: title.value.trim(), description: description.value.trim(), owner: sender, status: "pending", time: "刚刚", files });
      form.reset();
      $("task-files").dispatchEvent(new Event("change"));
      openedSent = id;
      selected = id;
      filter = "new";
      inboxOpen = true;
      render();
      document.querySelector(`[data-action="open-sent"][data-id="${id}"]`)?.focus();
      notify(`${id} 已提交给林舟`);
    }
    if (form.id === "result-form") {
      const result = form.elements.result.value.trim();
      if (!result) { notify("请填写处理说明。"); return; }
      const local = localTasks.find((task) => task.id === openedLocal);
      const task = byId(local.source);
      task.result = result;
      task.resultFiles = readFiles(form.elements.files);
      task.status = "review";
      local.lane = "review";
      writingResult = false;
      render();
      document.querySelector('[data-action="show-origin"]')?.focus();
      notify("结果已提交，等待提交人确认");
    }
    if (form.id === "followup-form") {
      const followup = form.elements.followup.value.trim();
      if (!followup) { notify("请填写要补充的问题。"); return; }
      const task = byId(openedSent);
      task.followup = followup;
      task.status = "doing";
      const local = localBySource(task.id);
      if (local) local.lane = "doing";
      render();
      document.querySelector(`[data-action="open-sent"][data-id="${task.id}"]`)?.focus();
      notify("补充问题已发回给接收人");
    }
  });

  function clearDrag() {
    dragId = null;
    document.querySelector('[data-lane="todo"]')?.classList.remove("drag-ready", "drag-over");
  }

  $("inbox-list").addEventListener("dragstart", (event) => {
    const item = event.target.closest('[draggable="true"]');
    if (!item) return;
    dragId = item.dataset.ticket;
    event.dataTransfer.effectAllowed = "copy";
    event.dataTransfer.setData("text/plain", dragId);
    document.querySelector('[data-lane="todo"]')?.classList.add("drag-ready");
  });
  $("inbox-list").addEventListener("dragend", clearDrag);
  $("board").addEventListener("dragover", (event) => {
    const lane = event.target.closest('[data-lane="todo"]');
    if (!dragId || !lane) return;
    event.preventDefault();
    event.dataTransfer.dropEffect = "copy";
    lane.classList.add("drag-over");
  });
  $("board").addEventListener("dragleave", (event) => {
    const lane = event.target.closest('[data-lane="todo"]');
    if (lane && !lane.contains(event.relatedTarget)) lane.classList.remove("drag-over");
  });
  $("board").addEventListener("drop", (event) => {
    if (!dragId || !event.target.closest('[data-lane="todo"]')) return;
    event.preventDefault();
    const id = dragId;
    clearDrag();
    importTicket(id);
  });

  const options = projects.map((name) => `<option>${escape(name)}</option>`).join("");
  $("project-select").innerHTML = options;
  render();
</script>
</body>
</html>
