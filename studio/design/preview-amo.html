<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>AMO Studio 设计预览</title>
  <style>
    :root { color-scheme: light; }
    :root[data-theme="dark"] { color-scheme: dark; }
    * { box-sizing: border-box; }
    body { margin: 0; height: 100vh; display: flex; flex-direction: column; font-family: "Microsoft YaHei UI", sans-serif; background: Canvas; color: CanvasText; }
    header { display: flex; align-items: center; gap: 12px 20px; padding: 10px 20px; background: light-dark(#fff, #1e232a); border-bottom: 1px solid light-dark(#d6dde1, #3d4651); flex-wrap: wrap; }
    h1 { margin: 0 auto 0 0; font-size: 16px; }
    nav, .themes { display: flex; gap: 3px; padding: 3px; border-radius: 8px; background: light-dark(#edf0f2, #2a3038); }
    button { border: 0; border-radius: 5px; padding: 6px 12px; background: transparent; color: inherit; cursor: pointer; font: inherit; font-size: 13px; }
    button[aria-pressed="true"] { background: light-dark(#263d4e, #dbe4eb); color: light-dark(#fff, #1c2c37); font-weight: 600; }
    button:focus-visible { outline: 2px solid light-dark(#1d6592, #9bcfff); }
    header > a { color: inherit; font-size: 13px; text-underline-offset: 3px; }
    iframe { display: block; flex: 1; min-height: 0; width: 100%; border: 0; background: Canvas; color-scheme: inherit; }
  </style>
</head>
<body>
  <header>
    <h1>AMO Studio 设计预览</h1>
    <a href="preview-amo-b-layout.html">查看 B 在现有布局中的效果</a>
    <nav aria-label="选择设计方案">
      <button type="button" data-src="preview-amo-a.html" aria-pressed="false">方案 A</button>
      <button type="button" data-src="preview-amo-b.html" aria-pressed="false">方案 B</button>
      <button type="button" data-src="preview-amo-d.html" aria-pressed="true">D · 色谱</button>
      <button type="button" data-src="preview-amo-e.html" aria-pressed="false">E · 墨印</button>
      <button type="button" data-src="preview-amo-f.html" aria-pressed="false">F · 轨迹</button>
    </nav>
    <div class="themes" role="group" aria-label="预览配色">
      <button type="button" data-theme-choice="light" aria-pressed="true">浅色</button>
      <button type="button" data-theme-choice="dark" aria-pressed="false">深色</button>
    </div>
  </header>
  <iframe title="设计方案预览" src="preview-amo-d.html?theme=light"></iframe>
  <script>
    const frame = document.querySelector('iframe');
    const currentTheme = () => document.documentElement.dataset.theme || 'light';
    const syncTheme = () => frame.contentWindow.postMessage({ previewTheme: currentTheme() }, '*');
    frame.addEventListener('load', syncTheme);
    document.querySelectorAll('nav button').forEach((button) => button.addEventListener('click', () => {
      document.querySelectorAll('nav button').forEach((item) => item.setAttribute('aria-pressed', String(item === button)));
      frame.src = button.dataset.src + '?theme=' + currentTheme();
    }));
    const themes = document.querySelectorAll('[data-theme-choice]');
    themes.forEach((button) => button.addEventListener('click', () => {
      document.documentElement.dataset.theme = button.dataset.themeChoice;
      syncTheme();
      themes.forEach((item) => item.setAttribute('aria-pressed', String(item === button)));
    }));
  </script>
</body>
</html>
