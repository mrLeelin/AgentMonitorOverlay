<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>任务轨迹 · AMO Studio 设计预览</title>
<style>
* { box-sizing: border-box; }
:root { color-scheme: light dark; font: 14px/1.55 "Segoe UI", "Microsoft YaHei UI", sans-serif; }
body { margin: 0; background: var(--bg); color: var(--ink); }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible { outline: 2px solid var(--focus); outline-offset: 3px; }
h1, h2, h3, p { margin: 0; }
.theme-control { border: 1px solid var(--line); background: var(--paper); color: var(--ink); padding: 5px 10px; border-radius: 6px; font-size: 12px; }
::selection { background: var(--focus); color: var(--bg); }

:root { --bg:light-dark(#f1f6f5,#101a1c); --paper:light-dark(#fff,#172529); --ink:light-dark(#152e32,#e0f1ef); --dim:light-dark(#516a6c,#a8c4c3); --line:light-dark(#c6d9d7,#354b4f); --wash:light-dark(#e6efed,#213235); --focus:light-dark(#006664,#72dac8); --active:light-dark(#006664,#94e4d2); --active-ink:light-dark(#fff,#102c29); --mono:"Cascadia Mono",Consolas,monospace; }
header { display:flex; gap:26px; align-items:center; background:var(--paper); border-bottom:1px solid var(--line); padding:0 4vw; height:66px; }
.brand { font-weight:730; font-size:19px; letter-spacing:-.04em; white-space:nowrap; }.brand::before { content:''; display:inline-block; width:13px; height:13px; border:4px solid var(--focus); vertical-align:-2px; margin-right:10px; border-radius:50%;}
.location { color:var(--dim); border-left:1px solid var(--line); padding-left:24px; }.theme-slot{margin-left:auto;}
main { max-width:1560px; margin:auto; padding:30px clamp(18px,4vw,70px); }
.heading { display:flex; gap:18px; justify-content:space-between; align-items:center; margin-bottom:20px; }
h1 { font-size:clamp(27px,3vw,40px); letter-spacing:-.04em; }
.group-by {display:flex; padding:3px; border-radius:7px; border:1px solid var(--line); background:var(--wash);}
.group-by button { border:0; border-radius:4px; padding:6px 12px; color:var(--dim); background:none; }
.group-by button[aria-pressed=true] { color:var(--active-ink); background:var(--active); }
.plot { overflow-x:auto; background:var(--paper); border:1px solid var(--line); border-radius:12px; }
.chart { min-width:780px; }
.axis, .lane { display:grid; grid-template-columns:130px minmax(0,1fr); }
.axis { color:var(--dim); font-size:12px; background:var(--wash); border-bottom:1px solid var(--line); }
.axis-label,.lane-title { padding:14px 16px; border-right:1px solid var(--line); }
.axis-ticks,.track { position:relative; }
.tick { position:absolute; top:14px; font:12px var(--mono); transform:translateX(-50%); }.tick:first-child{left:5px!important;transform:none;}
.lane+.lane { border-top:1px solid var(--line); }
.lane-title { margin:0; display:flex; flex-direction:column; justify-content:center; gap:4px; font-size:14px; }.lane-title small { font-weight:400; color:var(--dim); }
.track { background:repeating-linear-gradient(to right,transparent 0 calc(11.1111% - 1px), var(--line) calc(11.1111% - 1px) 11.1111%); height:158px; }
.track::before { content:''; position:absolute; inset:50% 0 auto; border-top:1px solid var(--line); }
.event { position:absolute; left:var(--pos); top:50%; transform:translateX(-50%); width:min(17%,148px); text-align:left; background:var(--wash); border:1px solid var(--line); border-radius:6px; padding:6px 9px; height:52px; margin-top:10px; }
.event.above { top:auto; bottom:50%; margin:0 0 10px; }
.event::before { content:''; position:absolute; width:8px; height:8px; border-radius:50%; background:var(--dim); top:-15px; left:calc(50% - 4px); }
.event.above::before { top:auto; bottom:-15px; }
.event strong { display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-size:12px; }
.event time { font:11px var(--mono); color:var(--dim); }
.event[aria-pressed=true] { background:var(--active); color:var(--active-ink); border-color:var(--active); }
.event[aria-pressed=true] time { color:inherit; }
.event[aria-pressed=true]::before { background:var(--focus); box-shadow:0 0 0 3px var(--paper),0 0 0 4px var(--focus); }
.event:hover:not([aria-pressed=true]){border-color:var(--focus);}
.details { margin-top:16px; padding:24px; border:1px solid var(--line); border-radius:12px; background:var(--paper); display:grid; grid-template-columns:1.1fr 1fr; gap:30px; }
.detail-title small { color:var(--focus); font-weight:650; }.detail-title h2{font-size:21px; margin:6px 0;}.detail-title p {color:var(--dim);}
.progress {border-left:1px solid var(--line); padding-left:24px;}.progress h3{font-size:13px;} .progress ul { margin:6px 0 0; padding-left:18px; font-size:13px; color:var(--dim); }.progress li::marker{color:var(--focus);}
@media(prefers-reduced-motion:no-preference){ .event {transition:background-color 150ms ease-out,border-color 150ms ease-out;} .details.changed .detail-title {animation:show 180ms ease-out;} @keyframes show{from{opacity:.5;transform:translateY(3px)}} }
@media(max-width:720px){header{height:55px;gap:12px}.location{padding-left:12px;font-size:12px}.heading{flex-wrap:wrap}.details{grid-template-columns:1fr;gap:18px}.progress{border-left:0;border-top:1px solid var(--line);padding:12px 0 0}.chart{min-width:760px;} }

</style>
</head>
<body>

<header><div class="brand">AMO Studio</div><div class="location">工作空间　/　会话活动</div><div class="theme-slot" data-theme-slot></div></header>
<main>
  <div class="heading"><h1>任务轨迹</h1><div class="group-by" role="group" aria-label="轨迹分组"><button data-key="project" aria-pressed="true">按项目</button><button data-key="model" aria-pressed="false">按模型</button></div></div>
  <div class="plot" role="region" aria-label="任务最近更新时间轴" tabindex="0"><div class="chart">
    <div class="axis"><div class="axis-label">最近更新 · 今天</div><div class="axis-ticks"></div></div>
    <div id="lanes"></div>
  </div></div>
  <section class="details" aria-live="polite"></section>
</main>
<script>
const root = document.documentElement;
function applyTheme(theme) {
  if (theme === 'light' || theme === 'dark') root.style.colorScheme = theme;
}
applyTheme(new URLSearchParams(location.search).get('theme') || 'light');
if (window.parent === window) {
  const toggle = document.createElement('button');
  toggle.className = 'theme-control';
  toggle.textContent = '深色模式';
  toggle.setAttribute('aria-pressed', String(root.style.colorScheme === 'dark'));
  toggle.addEventListener('click', () => {
    applyTheme(root.style.colorScheme === 'dark' ? 'light' : 'dark');
    toggle.setAttribute('aria-pressed', String(root.style.colorScheme === 'dark'));
  });
  document.querySelector('[data-theme-slot]').append(toggle);
} else {
  window.addEventListener('message', (event) => {
    if (event.source === window.parent) applyTheme(event.data?.previewTheme);
  });
}
const tasks = [
  {
    "title": "重新设计设置导航",
    "desc": "把搜索与分类放在左栏，滚动长设置页时保留标题和操作。",
    "project": "AMO Studio",
    "status": "待审阅",
    "model": "Codex",
    "time": "15:40",
    "history": [
      "核对分类与搜索的入口",
      "完成窄窗口与深浅主题检查",
      "提交导航预览，等待确认"
    ]
  },
  {
    "title": "梳理画布的拖拽反馈",
    "desc": "拖动任务时标明目标位置，松开后保留选中状态。",
    "project": "AMO Studio",
    "status": "进行中",
    "model": "Claude",
    "time": "14:20",
    "history": [
      "检查框选与移动的手势",
      "比较两种落点提示",
      "正在验证连续拖动"
    ]
  },
  {
    "title": "调整模型切换入口",
    "desc": "让常用模型和当前渠道在新建任务时更容易找到。",
    "project": "AMO Studio",
    "status": "待办",
    "model": "Codex",
    "time": "13:10",
    "history": [
      "记录常用模型的选择路径",
      "整理项目默认值"
    ]
  },
  {
    "title": "核对图集导出尺寸",
    "desc": "逐项检查导出倍率、透明边缘和命名规则。",
    "project": "素材管线",
    "status": "进行中",
    "model": "Codex",
    "time": "11:30",
    "history": [
      "读取图集清单",
      "已检查两组导出尺寸",
      "正在核对透明边缘"
    ]
  },
  {
    "title": "整理图标资源",
    "desc": "统一工具栏图标的线宽、视觉中心和导出命名。",
    "project": "素材管线",
    "status": "完成",
    "model": "Claude",
    "time": "10:45",
    "history": [
      "整理图标来源",
      "统一导出设置",
      "完成资源检查"
    ]
  },
  {
    "title": "检查会话恢复流程",
    "desc": "确认重新打开工作台后能够回到上次处理的任务。",
    "project": "AMO Studio",
    "status": "待办",
    "model": "Codex",
    "time": "09:15",
    "history": [
      "列出恢复场景",
      "准备隔离测试数据"
    ]
  }
];

function pos(hour) { return (hour-8)/9*100; }
function timeOf(task) { const [h,m]=task.time.split(':').map(Number); return h+m/60; }
let selected=0;
let groupKey='project';
document.querySelector('.axis-ticks').innerHTML=[8,9,10,11,12,13,14,15,16].map(h=>`<span class="tick" style="left:${pos(h)}%">${String(h).padStart(2,'0')}:00</span>`).join('');
function select(index) {
  selected=index;
  const t=tasks[index];
  document.querySelectorAll('.event').forEach(b=>b.setAttribute('aria-pressed',String(Number(b.dataset.i)===index)));
  const details=document.querySelector('.details');
  details.innerHTML=`<div class="detail-title"><small>${t.project} · ${t.model} · ${t.status}</small><h2>${t.title}</h2><p>${t.desc}</p></div><div class="progress"><h3>本轮进展</h3><ul>${t.history.map(s=>'<li>'+s+'</li>').join('')}</ul></div>`;
  details.classList.add('changed');
}
function render() {
  const names=[...new Set(tasks.map(t=>t[groupKey]))];
  document.querySelector('#lanes').innerHTML=names.map(name=>{
    const group=tasks.filter(t=>t[groupKey]===name).sort((a,b)=>timeOf(a)-timeOf(b));
    const events=group.map((t,i)=>`<button class="event ${i%2?'':'above'}" data-i="${tasks.indexOf(t)}" style="--pos:${pos(timeOf(t))}%" title="${t.time} · ${t.title}"><time>${t.time}</time><strong>${t.title}</strong></button>`).join('');
    return `<div class="lane"><h2 class="lane-title">${name}<small>${group.length} 项任务</small></h2><div class="track">${events}</div></div>`;
  }).join('');
  select(selected);
}
document.querySelector('#lanes').onclick=e=>{const b=e.target.closest('.event');if(b)select(Number(b.dataset.i))};
document.querySelectorAll('[data-key]').forEach(b=>b.onclick=()=>{
  groupKey=b.dataset.key;
  document.querySelectorAll('[data-key]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));
  render();
});
render();
</script>
</body>
</html>
